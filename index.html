<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按小学除法竖式规则生成竖式计算过程。" />
    <title>小学除法竖式生成器</title>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">STRING MATH · SVG · DOM</p>
        <h1>小学除法竖式生成器</h1>
        <p class="intro">按“被除数 ÷ 除数”输入整数，生成可缩放的长除法竖式。</p>
      </section>

      <section class="workspace" aria-label="除法竖式工作区">
        <form class="control-panel" id="division-form">
          <div class="input-grid">
            <label class="field">
              <span>被除数</span>
              <input id="dividend-input" name="dividend" inputmode="numeric" value="10230" autocomplete="off" />
            </label>
            <span class="division-operator" aria-hidden="true">÷</span>
            <label class="field">
              <span>除数</span>
              <input id="divisor-input" name="divisor" inputmode="numeric" value="25" autocomplete="off" />
            </label>
          </div>
          <div class="form-actions">
            <button class="primary-button" type="submit">生成竖式</button>
            <button class="ghost-button" type="button" id="sample-button">试试 10230 ÷ 25</button>
            <fieldset class="result-mode-group" aria-label="结果模式">
              <legend class="visually-hidden">结果模式</legend>
              <label class="mode-option">
                <input type="radio" name="result-mode" value="decimal" checked />
                <span>小数模式</span>
              </label>
              <label class="mode-option">
                <input type="radio" name="result-mode" value="remainder" />
                <span>余数模式</span>
              </label>
            </fieldset>
          </div>
          <p class="error-message" id="error-message" role="alert" aria-live="polite"></p>
          <div class="settings-panel" role="group" aria-label="渲染设置">
            <div class="settings-controls">
              <label class="range-field">
                <span>方格宽度 <output id="cw-output">44px</output></span>
                <input id="cw-input" type="range" min="32" max="64" value="44" />
              </label>
              <label class="range-field">
                <span>行高 <output id="rh-output">46px</output></span>
                <input id="rh-input" type="range" min="36" max="68" value="46" />
              </label>
              <label class="range-field">
                <span>字号比例 <output id="fs-output">0.62</output></span>
                <input id="fs-input" type="range" min="0.48" max="0.82" value="0.62" step="0.01" />
              </label>
              <label class="range-field">
                <span>弧线弯曲度 <output id="bend-output">1.00</output></span>
                <input id="bend-input" type="range" min="0.35" max="1.2" value="1" step="0.05" />
              </label>
              <label class="switch-field">
                <input id="grid-input" type="checkbox" />
                <span class="switch-ui" aria-hidden="true"></span>
                <span>显示辅助网格</span>
              </label>
              <label class="switch-field">
                <input id="uniform-subtraction-input" type="checkbox" />
                <span class="switch-ui" aria-hidden="true"></span>
                <span>减法横线等宽</span>
              </label>
            </div>
          </div>
        </form>

      <section class="result-card" aria-live="polite">
        <div class="result-heading">
          <div>
            <p class="panel-kicker">CALCULATION</p>
            <h2 id="result-title">10230 ÷ 25</h2>
          </div>
          <output class="answer" id="answer-output">409.2</output>
        </div>
        <p class="normalization" id="normalization-output">小数模式：10230 ÷ 25 = 409.2</p>
        <div class="renderer-comparison">
          <section class="renderer-panel" aria-labelledby="svg-renderer-title">
            <h3 id="svg-renderer-title">SVG</h3>
            <div class="stage-scroll">
              <div class="division-stage" id="svg-stage">
                <svg class="division-svg" id="division-svg" aria-label="SVG 除法竖式" role="img"></svg>
              </div>
            </div>
          </section>
          <section class="renderer-panel" aria-labelledby="dom-renderer-title">
            <h3 id="dom-renderer-title">div + CSS</h3>
            <div class="stage-scroll">
              <div class="division-stage" id="dom-stage">
                <div class="division-dom" id="division-dom" aria-label="div 加 CSS 除法竖式">
                  <div class="math-lines" id="math-lines" aria-hidden="true"></div>
                  <div class="math-layer" id="math-layer"></div>
                </div>
              </div>
            </div>
          </section>
        </div>
        <p class="legend"><span class="legend-line"></span>SVG 与 div + CSS 使用相同坐标并列展示，便于比较。</p>
      </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
