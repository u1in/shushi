    <title>竖式·Shushi｜在线竖式计算与渲染工具</title>
    <script>
      // 首屏先恢复主题属性，避免 Vue 挂载前出现一次错误的浅色闪烁。
      ;(() => {
        try {
          const storedMode = window.localStorage.getItem('shushi-theme-mode')
          const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const mode = storedMode === 'light' || storedMode === 'dark' ? storedMode : systemMode
          if (storedMode === 'light' || storedMode === 'dark') document.documentElement.dataset.theme = storedMode
          document
            .getElementById('site-favicon')
            ?.setAttribute('href', mode === 'dark' ? './shushi-logo-dark.svg' : './shushi-logo-light.svg')
        } catch {
          // 本地存储不可用时由 CSS 的系统主题规则接管。
        }
      })()
    </script>
